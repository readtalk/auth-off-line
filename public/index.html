<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>READTalk</title>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
				background: #ffffff;
				color: #111b21;
				height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				margin: 0;
				overflow: hidden;
				transition: opacity 0.9s ease;
			}

			body.fade-out {
				opacity: 0;
			}

			.loader {
				text-align: center;
				opacity: 0;
				animation: fadeIn 1.6s ease-in-out forwards;
			}

			.logo {
				width: 120px;
				height: 120px;
				margin: 0 auto 20px auto;
				background: #ff0000;
				border-radius: 24px;
				display: flex;
				align-items: center;
				justify-content: center;
				box-shadow: 0 8px 32px rgba(255, 0, 0, 0.25);
				animation: pulse 2.8s ease-in-out infinite;
				overflow: hidden;
			}

			.logo img {
				width: 100%;
				height: 100%;
				object-fit: cover;
			}

			.logo span {
				font-size: 48px;
				font-weight: 700;
				color: #ffffff;
				letter-spacing: -2px;
			}

			.loader h1 {
				font-size: 2.8rem;
				font-weight: 600;
				letter-spacing: -0.5px;
				color: #111b21;
				margin-bottom: 2px;
			}

			.loader h1 b {
				color: #ff0000;
				font-weight: 700;
			}

			.typing {
				font-size: 1.4rem;
				color: #667781;
				font-weight: 400;
				min-height: 2.4rem;
			}

			.typing .cursor {
				display: inline-block;
				width: 2px;
				height: 1.2em;
				background: #ff0000;
				margin-left: 2px;
				vertical-align: text-bottom;
				animation: blink 0.8s step-end infinite;
			}

			.typing .cursor.hidden {
				opacity: 0;
			}

			@keyframes fadeIn {
				0% { opacity: 0; transform: scale(0.96); }
				100% { opacity: 1; transform: scale(1); }
			}

			@keyframes pulse {
				0%, 100% { transform: scale(1); box-shadow: 0 8px 32px rgba(255, 0, 0, 0.25); }
				50% { transform: scale(1.03); box-shadow: 0 12px 48px rgba(255, 0, 0, 0.35); }
			}

			@keyframes blink {
				0%, 100% { opacity: 1; }
				50% { opacity: 0; }
			}
		</style>
	</head>
	<body>
		<div class="loader" id="loader">
			<div class="logo" id="logo">
				<span></span>
			</div>
			<h1><b>READT</b>alk</h1>
			<div class="typing" id="typing">
				<span id="typewriter"></span><span class="cursor" id="cursor"></span>
			</div>
		</div>

		<script>
			(function() {
				const messages = [
					"To Talk ...",
					"To Trust ...",
					"Secure your privacy",
					
				];

				let msgIndex = 0;
				let charIndex = 0;
				let isDeleting = false;
				const typewriter = document.getElementById('typewriter');
				const cursor = document.getElementById('cursor');
				const body = document.body;

				function typeEffect() {
					const currentMsg = messages[msgIndex];
					const speed = isDeleting ? 40 : 80;

					if (!isDeleting && charIndex < currentMsg.length) {
						typewriter.textContent += currentMsg.charAt(charIndex);
						charIndex++;
						setTimeout(typeEffect, speed);
					} else if (isDeleting && charIndex > 0) {
						typewriter.textContent = currentMsg.substring(0, charIndex - 1);
						charIndex--;
						setTimeout(typeEffect, speed);
					} else {
						if (!isDeleting) {
							setTimeout(() => {
								isDeleting = true;
								setTimeout(typeEffect, 300);
							}, 2000);
						} else {
							isDeleting = false;
							msgIndex = (msgIndex + 1) % messages.length;
							charIndex = 0;
							setTimeout(typeEffect, 400);
						}
					}
				}

				setTimeout(() => {
					typeEffect();
				}, 400);

				const totalDelay = 5800;

				setTimeout(() => {
					cursor.classList.add('hidden');
					body.classList.add('fade-out');

					setTimeout(() => {
						const base = window.location.origin;
						window.location.href = base + '/password/authorize';
					}, 900);
				}, totalDelay);

				const logo = document.getElementById('logo');
				const brandUrl = 'https://raw.githubusercontent.com/readtalk/global/refs/heads/main/public/brand.png';
				fetch(brandUrl, { mode: 'no-cors' })
					.then(() => {
						logo.innerHTML = `<img src="${brandUrl}" alt="READTalk" />`;
					})
					.catch(() => {
					});
			})();
		</script>
	</body>
</html>
