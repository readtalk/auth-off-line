<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>READTalk</title>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
				background: #ffffff;
				color: #111b21;
				height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				margin: 0;
				overflow: hidden;
			}

			.loader {
				text-align: center;
				opacity: 0;
				animation: fadeIn 1.4s ease-in-out forwards;
			}

			.logo {
				width: 120px;
				height: 120px;
				margin: 0 auto 24px auto;
				background: #ff0000;
				border-radius: 24px;
				display: flex;
				align-items: center;
				justify-content: center;
				box-shadow: 0 8px 32px rgba(255, 0, 0, 0.25);
				animation: pulse 2.4s ease-in-out infinite;
			}

			.logo span {
				font-size: 48px;
				font-weight: 700;
				color: #ffffff;
				letter-spacing: -2px;
			}

			.loader h1 {
				font-size: 2.8rem;
				font-weight: 600;
				letter-spacing: -0.5px;
				color: #111b21;
				margin-bottom: 6px;
			}

			.loader h1 b {
				color: #ff0000;
				font-weight: 700;
			}

			.loader p {
				font-size: 1.4rem;
				color: #667781;
				font-weight: 400;
			}

			.loader .dot {
				display: inline-block;
				animation: dotBounce 1.4s ease-in-out infinite;
			}

			.loader .dot:nth-child(2) { animation-delay: 0.2s; }
			.loader .dot:nth-child(3) { animation-delay: 0.4s; }

			@keyframes fadeIn {
				0% { opacity: 0; transform: scale(0.96); }
				100% { opacity: 1; transform: scale(1); }
			}

			@keyframes pulse {
				0%, 100% { transform: scale(1); box-shadow: 0 8px 32px rgba(255, 0, 0, 0.25); }
				50% { transform: scale(1.03); box-shadow: 0 12px 48px rgba(255, 0, 0, 0.35); }
			}

			@keyframes dotBounce {
				0%, 80%, 100% { opacity: 0.2; transform: translateY(0); }
				40% { opacity: 1; transform: translateY(-6px); }
			}
		</style>
	</head>
	<body>
		<div class="loader" id="loader">
			<div class="logo">
				<span>RT</span>
			</div>
			<h1><b>READ</b>Talk</h1>
			<p>
				Loading<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
			</p>
		</div>

		<script>
			(function() {
				const target = '/password/authorize';
				const delay = 3800;

				setTimeout(function() {
					const base = window.location.origin;
					const url = base + target;
					window.location.href = url;
				}, delay);
			})();
		</script>
	</body>
</html>
