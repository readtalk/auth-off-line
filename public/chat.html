<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>READTalk Messenger</title>

    <style>
        :root {
            --primary-color: #000000;
            --primary-hover: #2f2f2f;

            --background-color: #f8f8f8;
            --light-bg: #f3f4f6;

            --border-color: #e5e7eb;

            --text-color: #1f2937;
            --text-light: #6b7280;

            --user-msg-bg: #cfcfcf;
            --assistant-msg-bg: #ffffff;

            --code-bg: #1e1e1e;
            --code-header: #2b2b2b;

            --sidebar-width: 280px;
            --sidebar-bg: #ffffff;
            --sidebar-border: #e5e7eb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100dvh;
            overflow: hidden;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Oxygen,
                Ubuntu,
                Cantarell,
                sans-serif;

            background: var(--background-color);
            color: var(--text-color);

            display: flex;

            max-width: 1200px;
            margin: 0 auto;

            padding: 0.75rem;
        }

        .sidebar {
            width: var(--sidebar-width);
            flex-shrink: 0;

            display: flex;
            flex-direction: column;

            border-right: 1px solid var(--sidebar-border);
            padding-right: 1rem;

            background: var(--sidebar-bg);

            overflow-y: auto;
        }

        .sidebar-header {
            padding: 0.5rem 0 0.75rem;
            margin-bottom: 0.75rem;

            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 0.1rem;
        }

        .sidebar-header p {
            font-size: 0.9rem;
            color: var(--text-light);
        }

        .sidebar-nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;

            padding: 0.7rem 0.9rem;

            border-radius: 12px;

            cursor: pointer;

            transition: background 0.15s ease;

            color: var(--text-color);
            text-decoration: none;
        }

        .sidebar-item:hover {
            background: var(--light-bg);
        }

        .sidebar-item.active {
            background: var(--light-bg);
            font-weight: 600;
        }

        .sidebar-item .icon {
            font-size: 1.2rem;
            width: 1.6rem;
            text-align: center;
            flex-shrink: 0;
        }

        .sidebar-item .label {
            font-size: 0.95rem;
        }

        .sidebar-item .badge {
            margin-left: auto;
            background: var(--primary-color);
            color: white;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.15rem 0.5rem;
            border-radius: 999px;
        }

        .sidebar-footer {
            padding-top: 0.75rem;
            margin-top: 0.75rem;

            border-top: 1px solid var(--border-color);

            font-size: 0.85rem;
            color: var(--text-light);
        }

        .sidebar-footer .user-info {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .sidebar-footer .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--primary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .sidebar-footer .user-name {
            font-weight: 500;
            color: var(--text-color);
        }

        /* =========================
           CHAT (second view)
        ========================= */

        .chat-container {
            flex: 1;

            display: flex;
            flex-direction: column;

            overflow: hidden;

            margin-left: 1rem;

            border: 1px solid var(--border-color);
            border-radius: 16px;

            background: white;
        }

        .chat-messages {
            flex: 1;

            overflow-y: auto;

            padding: 1rem;

            background: var(--light-bg);

            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #c9c9c9;
            border-radius: 999px;
        }

        .message {
            width: fit-content;
            max-width: 78%;

            padding: 0.9rem 1rem;

            margin-bottom: 1rem;

            border-radius: 16px;

            overflow-wrap: anywhere;

            animation: fadeIn 0.15s ease;
        }

        .assistant-message {
            background: var(--assistant-msg-bg);

            margin-right: auto;

            border-bottom-left-radius: 4px;
        }

        .user-message {
            background: var(--user-msg-bg);

            margin-left: auto;

            border-bottom-right-radius: 4px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-content {
            font-size: 1rem;
            line-height: 1.7;
        }

        .message-content p {
            margin-bottom: 0.7rem;
        }

        .message-content p:last-child {
            margin-bottom: 0;
        }

        .typing-indicator {
            display: none;

            padding: 0 1rem 0.75rem;

            color: var(--text-light);

            font-size: 0.9rem;
            font-style: italic;

            background: var(--light-bg);
        }

        .typing-indicator.visible {
            display: block;
        }

        .message-input {
            position: relative;

            display: flex;
            align-items: flex-end;
            gap: 0.75rem;

            padding: 0.85rem;

            border-top: 1px solid var(--border-color);

            background: white;

            flex-shrink: 0;
        }

        .input-wrapper {
            flex: 1;

            display: flex;
            align-items: flex-end;
            gap: 0.5rem;

            padding: 0.6rem 0.75rem;

            border: 1px solid var(--border-color);
            border-radius: 16px;

            background: white;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .input-wrapper:focus-within {
            border-color: var(--primary-color);

            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.05);
        }

        #emoji-button {
            border: none;
            background: transparent;

            cursor: pointer;

            font-size: 1.5rem;

            line-height: 1;
        }

        #user-input {
            flex: 1;

            border: none;
            outline: none;
            resize: none;

            background: transparent;

            font-size: 1rem;
            font-family: inherit;

            line-height: 1.5;

            max-height: 120px;

            overflow-y: auto;
        }

        #send-button {
            width: 50px;
            height: 50px;

            flex-shrink: 0;

            border: none;
            border-radius: 50%;

            background: var(--primary-color);
            color: white;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 1.3rem;

            transition:
                transform 0.15s ease,
                background 0.2s ease;
        }

        #send-button:hover {
            background: var(--primary-hover);
        }

        #send-button:active {
            transform: scale(0.96);
        }

        #send-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .emoji-picker {
            position: absolute;

            left: 1rem;
            bottom: 5.5rem;

            width: min(350px, calc(100vw - 2rem));

            max-height: 280px;

            overflow-y: auto;

            display: none;
            grid-template-columns: repeat(8, 1fr);
            gap: 0.3rem;

            padding: 0.75rem;

            background: white;

            border: 1px solid var(--border-color);
            border-radius: 16px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);

            z-index: 999;
        }

        .emoji-picker.show {
            display: grid;
        }

        .emoji-item {
            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0.35rem;

            border-radius: 10px;

            cursor: pointer;

            font-size: 1.3rem;

            transition:
                background 0.15s ease,
                transform 0.15s ease;
        }

        .emoji-item:hover {
            background: var(--light-bg);
            transform: scale(1.08);
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 768px) {
            body {
                padding: 0.5rem;
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                padding-right: 0;
                border-right: none;
                border-bottom: 1px solid var(--sidebar-border);
                padding-bottom: 0.5rem;
                margin-bottom: 0.5rem;
                overflow-y: visible;
            }

            .sidebar-header {
                border-bottom: none;
                padding: 0;
                margin-bottom: 0;
            }

            .sidebar-header h1 {
                font-size: 1.4rem;
            }

            .sidebar-header p {
                display: none;
            }

            .sidebar-nav {
                flex-direction: row;
                gap: 0.2rem;
            }

            .sidebar-item {
                padding: 0.4rem 0.6rem;
                font-size: 0.85rem;
            }

            .sidebar-item .label {
                display: none;
            }

            .sidebar-item .badge {
                display: none;
            }

            .sidebar-footer {
                display: none;
            }

            .chat-container {
                margin-left: 0;
                border-radius: 12px;
            }

            .message {
                max-width: 88%;
            }

            .chat-messages {
                padding: 0.75rem;
            }

            .message-input {
                padding: 0.7rem;
            }

            #send-button {
                width: 46px;
                height: 46px;
            }
        }
    </style>
</head>

<body>

</html>
